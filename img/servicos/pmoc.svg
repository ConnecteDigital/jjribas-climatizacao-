<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13315c"/>
      <stop offset="1" stop-color="#071a33"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5e3c"/>
      <stop offset="1" stop-color="#6b4429"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef3"/>
      <stop offset="1" stop-color="#9aa6b4"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="500" cy="80" r="160" fill="#8ecdf7" opacity=".08"/>
  <circle cx="80" cy="360" r="120" fill="#1d84f0" opacity=".1"/>

  <!-- Prédio comercial ao fundo -->
  <g opacity=".5" fill="#2b5c8f">
    <rect x="420" y="120" width="140" height="280"/>
    <g fill="#8ecdf7" opacity=".6">
      <rect x="436" y="140" width="22" height="16"/><rect x="468" y="140" width="22" height="16"/><rect x="500" y="140" width="22" height="16"/><rect x="532" y="140" width="16" height="16"/>
      <rect x="436" y="172" width="22" height="16"/><rect x="468" y="172" width="22" height="16"/><rect x="500" y="172" width="22" height="16"/><rect x="532" y="172" width="16" height="16"/>
      <rect x="436" y="204" width="22" height="16"/><rect x="468" y="204" width="22" height="16"/><rect x="500" y="204" width="22" height="16"/><rect x="532" y="204" width="16" height="16"/>
      <rect x="436" y="236" width="22" height="16"/><rect x="468" y="236" width="22" height="16"/><rect x="500" y="236" width="22" height="16"/><rect x="532" y="236" width="16" height="16"/>
    </g>
  </g>

  <!-- Prancheta -->
  <g filter="url(#sh)" transform="rotate(-4 260 210)">
    <rect x="140" y="40" width="250" height="330" rx="14" fill="url(#board)"/>
    <rect x="158" y="70" width="214" height="284" rx="4" fill="#fff"/>
    <rect x="215" y="28" width="100" height="40" rx="8" fill="url(#clip)"/>
    <circle cx="265" cy="38" r="6" fill="#6b4429"/>

    <text x="176" y="104" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0b2545">PMOC</text>
    <text x="176" y="122" font-family="Arial, sans-serif" font-size="10" fill="#5b6b7c">Plano de Manutenção, Operação e Controle</text>
    <path d="M176 132h178" stroke="#dce6f0" stroke-width="2"/>

    <g font-family="Arial, sans-serif" font-size="12" fill="#1c2b3a">
      <rect x="176" y="146" width="18" height="18" rx="4" fill="#e7f9ef" stroke="#25a35f" stroke-width="2"/>
      <path d="M180 155l4 4 7-8" fill="none" stroke="#25a35f" stroke-width="3" stroke-linecap="round"/>
      <text x="204" y="160">Limpeza de filtros</text>

      <rect x="176" y="176" width="18" height="18" rx="4" fill="#e7f9ef" stroke="#25a35f" stroke-width="2"/>
      <path d="M180 185l4 4 7-8" fill="none" stroke="#25a35f" stroke-width="3" stroke-linecap="round"/>
      <text x="204" y="190">Bandeja e dreno</text>

      <rect x="176" y="206" width="18" height="18" rx="4" fill="#e7f9ef" stroke="#25a35f" stroke-width="2"/>
      <path d="M180 215l4 4 7-8" fill="none" stroke="#25a35f" stroke-width="3" stroke-linecap="round"/>
      <text x="204" y="220">Pressões e corrente</text>

      <rect x="176" y="236" width="18" height="18" rx="4" fill="#e7f9ef" stroke="#25a35f" stroke-width="2"/>
      <path d="M180 245l4 4 7-8" fill="none" stroke="#25a35f" stroke-width="3" stroke-linecap="round"/>
      <text x="204" y="250">Qualidade do ar</text>

      <rect x="176" y="266" width="18" height="18" rx="4" fill="#fff" stroke="#9aa6b4" stroke-width="2"/>
      <text x="204" y="280" fill="#5b6b7c">Relatório mensal</text>
    </g>
    <path d="M176 312h90" stroke="#1c2b3a" stroke-width="1"/>
    <path d="M180 306c10-14 18 6 26-4s14 4 24-6 10 6 18 2" fill="none" stroke="#0f6bd8" stroke-width="2"/>
    <text x="176" y="326" font-family="Arial, sans-serif" font-size="9" fill="#5b6b7c">Responsável técnico • ART</text>

    <!-- Carimbo -->
    <g transform="translate(320 300) rotate(-14)" opacity=".85">
      <circle r="30" fill="none" stroke="#0f6bd8" stroke-width="3"/>
      <circle r="24" fill="none" stroke="#0f6bd8" stroke-width="1.5"/>
      <text y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="800" fill="#0f6bd8">EM DIA</text>
      <text y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#0f6bd8">LEI 13.589</text>
    </g>
  </g>

  <!-- Caneta -->
  <g transform="translate(400 290) rotate(35)" filter="url(#sh)">
    <rect width="120" height="14" rx="7" fill="#0f6bd8"/>
    <path d="M120 0l22 7-22 7z" fill="#e9eef3"/>
    <path d="M136 5l6 2-6 2z" fill="#1a2a3c"/>
    <rect x="10" y="-4" width="40" height="5" rx="2" fill="#9aa6b4"/>
  </g>

  <!-- Calendário -->
  <g transform="translate(60 70)" filter="url(#sh)">
    <rect width="96" height="96" rx="12" fill="#fff"/>
    <rect width="96" height="28" rx="12" fill="#ff7a1a"/>
    <rect y="16" width="96" height="12" fill="#ff7a1a"/>
    <text x="48" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">MENSAL</text>
    <g fill="#dce6f0">
      <rect x="12" y="38" width="14" height="12" rx="2"/><rect x="31" y="38" width="14" height="12" rx="2"/><rect x="50" y="38" width="14" height="12" rx="2"/><rect x="69" y="38" width="14" height="12" rx="2"/>
      <rect x="12" y="56" width="14" height="12" rx="2"/><rect x="31" y="56" width="14" height="12" rx="2"/><rect x="69" y="56" width="14" height="12" rx="2"/>
      <rect x="12" y="74" width="14" height="12" rx="2"/><rect x="31" y="74" width="14" height="12" rx="2"/><rect x="50" y="74" width="14" height="12" rx="2"/><rect x="69" y="74" width="14" height="12" rx="2"/>
    </g>
    <rect x="50" y="56" width="14" height="12" rx="2" fill="#0f6bd8"/>
  </g>
</svg>
