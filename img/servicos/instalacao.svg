<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset="1" stop-color="#d4dde7"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".75" stop-color="#edf1f5"/>
      <stop offset="1" stop-color="#c9d3de"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c5a2c"/>
      <stop offset=".5" stop-color="#e3a06b"/>
      <stop offset="1" stop-color="#9c5a2c"/>
    </linearGradient>
    <linearGradient id="ladder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8c3cf"/>
      <stop offset=".5" stop-color="#eef2f6"/>
      <stop offset="1" stop-color="#9aa6b4"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0b2545" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#wall)"/>
  <rect y="352" width="600" height="48" fill="#a98159"/>
  <rect y="346" width="600" height="8" fill="#c4ced8"/>

  <!-- Placa de fixação na parede -->
  <rect x="96" y="74" width="300" height="80" rx="4" fill="none" stroke="#9aa6b4" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Unidade evaporadora sendo instalada -->
  <g filter="url(#sh)" transform="rotate(-2 246 118)">
    <rect x="100" y="70" width="300" height="94" rx="16" fill="url(#unit)"/>
    <rect x="100" y="134" width="300" height="30" rx="10" fill="#dae1e9"/>
    <rect x="116" y="142" width="268" height="11" rx="5" fill="#7d8ea1"/>
    <rect x="118" y="88" width="170" height="3" rx="1.5" fill="#e3e9ef"/>
    <circle cx="372" cy="104" r="4" fill="#2bd46f"/>
  </g>

  <!-- Tubulação de cobre com isolamento -->
  <g>
    <path d="M396 128h40v240" fill="none" stroke="#2c3e50" stroke-width="22" stroke-linejoin="round"/>
    <path d="M396 120h34v248" fill="none" stroke="url(#copper)" stroke-width="7"/>
    <path d="M396 136h46v232" fill="none" stroke="url(#copper)" stroke-width="9"/>
    <rect x="424" y="196" width="26" height="12" rx="2" fill="#f5f5f5" stroke="#bfc8d2"/>
    <rect x="424" y="276" width="26" height="12" rx="2" fill="#f5f5f5" stroke="#bfc8d2"/>
  </g>

  <!-- Nível de bolha -->
  <g transform="translate(150 44)">
    <rect width="140" height="18" rx="3" fill="#ffc21a" stroke="#c99400"/>
    <rect x="58" y="4" width="24" height="10" rx="5" fill="#bdf2a6" stroke="#6aa957"/>
    <circle cx="70" cy="9" r="3.5" fill="#fff"/>
  </g>

  <!-- Escada -->
  <g>
    <path d="M470 90l-40 262M540 90l40 262" stroke="url(#ladder)" stroke-width="12" stroke-linecap="round"/>
    <g stroke="#b8c3cf" stroke-width="8" stroke-linecap="round">
      <path d="M465 125h80M459 170h93M452 215h107M445 260h121M438 305h135"/>
    </g>
    <rect x="462" y="84" width="86" height="14" rx="4" fill="#ff7a1a"/>
  </g>

  <!-- Caixa de ferramentas -->
  <g filter="url(#sh)">
    <rect x="70" y="298" width="150" height="56" rx="6" fill="#d9302c"/>
    <rect x="70" y="298" width="150" height="16" rx="6" fill="#b52521"/>
    <path d="M120 298v-14a6 6 0 0 1 6-6h38a6 6 0 0 1 6 6v14" fill="none" stroke="#1f2b38" stroke-width="7"/>
    <rect x="135" y="318" width="20" height="10" rx="2" fill="#e9eef3"/>
  </g>

  <!-- Furadeira -->
  <g transform="translate(250 300)" filter="url(#sh)">
    <rect x="0" y="0" width="90" height="34" rx="12" fill="#0f6bd8"/>
    <rect x="24" y="30" width="28" height="30" rx="6" fill="#1a2a3c"/>
    <rect x="22" y="56" width="34" height="14" rx="3" fill="#0f6bd8"/>
    <rect x="90" y="11" width="16" height="12" rx="2" fill="#4b5a6a"/>
    <rect x="106" y="15" width="44" height="4" rx="2" fill="#9aa6b4"/>
  </g>

</svg>
