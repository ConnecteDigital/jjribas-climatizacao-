<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb6e6"/>
      <stop offset="1" stop-color="#d6e9f8"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset=".6" stop-color="#e3e9ef"/>
      <stop offset="1" stop-color="#bfc9d4"/>
    </linearGradient>
    <radialGradient id="fan" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3a4b60"/>
      <stop offset="1" stop-color="#1a2532"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa3ad"/>
      <stop offset="1" stop-color="#6f7882"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0b2545" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>
  <g fill="#fff" opacity=".8">
    <ellipse cx="110" cy="70" rx="60" ry="16"/><ellipse cx="150" cy="60" rx="40" ry="18"/>
    <ellipse cx="470" cy="50" rx="70" ry="14"/>
  </g>
  <!-- Prédios ao fundo -->
  <g fill="#8aa1b8">
    <rect x="0" y="190" width="60" height="120"/><rect x="66" y="160" width="50" height="150"/>
    <rect x="480" y="170" width="54" height="140"/><rect x="540" y="200" width="60" height="110"/>
  </g>
  <!-- Laje / telhado -->
  <rect y="300" width="600" height="100" fill="url(#roof)"/>
  <rect y="296" width="600" height="8" fill="#b7bfc8"/>

  <!-- Condensadora 1 -->
  <g filter="url(#sh)">
    <rect x="120" y="150" width="250" height="180" rx="10" fill="url(#case)"/>
    <circle cx="225" cy="240" r="72" fill="url(#fan)"/>
    <g stroke="#7d8ea1" stroke-width="3" fill="none">
      <circle cx="225" cy="240" r="72"/><circle cx="225" cy="240" r="56"/><circle cx="225" cy="240" r="40"/><circle cx="225" cy="240" r="24"/>
      <path d="M153 240h144M225 168v144"/>
    </g>
    <g fill="#55687d" opacity=".9">
      <path d="M225 240c-6-30 4-52 26-58-4 24-12 42-26 58z"/>
      <path d="M225 240c30-6 52 4 58 26-24-4-42-12-58-26z"/>
      <path d="M225 240c6 30-4 52-26 58 4-24 12-42 26-58z"/>
      <path d="M225 240c-30 6-52-4-58-26 24 4 42 12 58 26z"/>
    </g>
    <circle cx="225" cy="240" r="9" fill="#9aa6b4"/>
    <!-- grelha lateral -->
    <g stroke="#b3bdc8" stroke-width="2.5">
      <path d="M318 172h36M318 182h36M318 192h36M318 202h36M318 212h36M318 222h36M318 232h36M318 242h36M318 252h36M318 262h36M318 272h36M318 282h36M318 292h36M318 302h36"/>
    </g>
    <rect x="130" y="330" width="40" height="8" fill="#5b6b7c"/><rect x="320" y="330" width="40" height="8" fill="#5b6b7c"/>
    <!-- válvulas de serviço -->
    <rect x="370" y="250" width="16" height="12" rx="2" fill="#c08a3e"/>
    <rect x="370" y="278" width="16" height="12" rx="2" fill="#c08a3e"/>
  </g>

  <!-- Manifold (manômetros) -->
  <g transform="translate(410 118)" filter="url(#sh)">
    <rect x="10" y="64" width="150" height="34" rx="8" fill="#2b3e55"/>
    <circle cx="45" cy="45" r="36" fill="#1f5fbf"/>
    <circle cx="45" cy="45" r="29" fill="#fff"/>
    <circle cx="125" cy="45" r="36" fill="#d9302c"/>
    <circle cx="125" cy="45" r="29" fill="#fff"/>
    <g stroke="#9aa6b4" stroke-width="2">
      <path d="M22 45h6M62 45h6M45 22v6M29 29l4 4M61 29l-4 4"/>
      <path d="M102 45h6M142 45h6M125 22v6M109 29l4 4M141 29l-4 4"/>
    </g>
    <path d="M45 45l14-14" stroke="#1a2a3c" stroke-width="3" stroke-linecap="round"/>
    <path d="M125 45l-8-18" stroke="#1a2a3c" stroke-width="3" stroke-linecap="round"/>
    <circle cx="45" cy="45" r="3.5" fill="#1a2a3c"/><circle cx="125" cy="45" r="3.5" fill="#1a2a3c"/>
    <rect x="-2" y="74" width="16" height="14" rx="3" fill="#1f5fbf"/>
    <rect x="156" y="74" width="16" height="14" rx="3" fill="#d9302c"/>
  </g>
  <!-- Mangueiras -->
  <path d="M410 206c-30 10-10 50-24 50" fill="none" stroke="#1f5fbf" stroke-width="7" stroke-linecap="round"/>
  <path d="M590 206c10 60-40 90-90 84-60-6-80-6-114-6" fill="none" stroke="#d9302c" stroke-width="7" stroke-linecap="round"/>
  <path d="M495 216c0 60 10 90 30 110" fill="none" stroke="#ffc21a" stroke-width="7" stroke-linecap="round"/>

  <!-- Cilindro de gás -->
  <g filter="url(#sh)">
    <rect x="500" y="300" width="60" height="80" rx="18" fill="#2e9e6a"/>
    <rect x="515" y="286" width="30" height="18" rx="4" fill="#24805a"/>
    <rect x="508" y="330" width="44" height="18" rx="3" fill="#fff" opacity=".85"/>
    <text x="530" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#24805a">R-410A</text>
  </g>

  <!-- Chave e multímetro -->
  <g transform="translate(40 330)" filter="url(#sh)">
    <rect width="58" height="40" rx="6" fill="#ffc21a"/>
    <rect x="8" y="6" width="42" height="16" rx="2" fill="#c9e6c2"/>
    <text x="29" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2b3e55">220V</text>
    <circle cx="29" cy="31" r="5" fill="#2b3e55"/>
  </g>
</svg>
