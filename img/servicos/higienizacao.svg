<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#d8e1ea"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6dee7"/>
    </linearGradient>
    <linearGradient id="fins" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd6de"/>
      <stop offset="1" stop-color="#9aa6b4"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecdf7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1d84f0" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f6bd8"/>
      <stop offset=".5" stop-color="#3d9bf5"/>
      <stop offset="1" stop-color="#0b55ad"/>
    </linearGradient>
    <radialGradient id="mist" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#e8f4fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0b2545" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#wall)"/>

  <!-- Evaporadora com tampa aberta -->
  <g filter="url(#sh)">
    <rect x="70" y="60" width="380" height="120" rx="16" fill="url(#unit)"/>
    <!-- serpentina exposta -->
    <rect x="88" y="78" width="344" height="70" rx="4" fill="url(#fins)"/>
    <g stroke="#7d8ea1" stroke-width="1.6">
      <path d="M96 78v70M104 78v70M112 78v70M120 78v70M128 78v70M136 78v70M144 78v70M152 78v70M160 78v70M168 78v70M176 78v70M184 78v70M192 78v70M200 78v70M208 78v70M216 78v70M224 78v70M232 78v70M240 78v70M248 78v70M256 78v70M264 78v70M272 78v70M280 78v70M288 78v70M296 78v70M304 78v70M312 78v70M320 78v70M328 78v70M336 78v70M344 78v70M352 78v70M360 78v70M368 78v70M376 78v70M384 78v70M392 78v70M400 78v70M408 78v70M416 78v70M424 78v70"/>
    </g>
    <!-- metade suja / metade limpa -->
    <rect x="88" y="78" width="150" height="70" fill="#6b5a3e" opacity=".45"/>
    <g fill="#3f3a2a" opacity=".35">
      <circle cx="110" cy="96" r="7"/><circle cx="150" cy="120" r="9"/><circle cx="196" cy="94" r="6"/><circle cx="220" cy="132" r="8"/><circle cx="128" cy="138" r="5"/>
    </g>
    <rect x="70" y="150" width="380" height="30" rx="10" fill="#dbe2ea"/>
    <rect x="88" y="158" width="344" height="11" rx="5" fill="#7d8ea1"/>
    <!-- tampa frontal levantada -->
    <path d="M78 62l-10-46h384l-10 46z" fill="#ffffff" stroke="#cfd8e2" stroke-width="2"/>
  </g>

  <!-- Bolsa coletora de higienização -->
  <path d="M60 182h400l-60 120h-280z" fill="url(#bag)" stroke="#1d84f0" stroke-opacity=".5" stroke-width="2"/>
  <path d="M260 302v70" stroke="#1d84f0" stroke-opacity=".6" stroke-width="10" stroke-linecap="round"/>
  <!-- água suja -->
  <path d="M150 280c40-8 80 6 120-2s80 4 110 0l-14 22H162z" fill="#7a6a4a" opacity=".55"/>
  <!-- balde -->
  <g filter="url(#sh)">
    <path d="M216 350h88l-8 46h-72z" fill="#e9eef3" stroke="#bfc8d2" stroke-width="2"/>
    <ellipse cx="260" cy="350" rx="44" ry="8" fill="#9aa6b4"/>
    <ellipse cx="260" cy="351" rx="38" ry="5" fill="#7a6a4a" opacity=".6"/>
  </g>
  <!-- gotas -->
  <g fill="#3d9bf5" opacity=".8">
    <path d="M300 200c4 8 6 12 0 14s-4-6 0-14z"/>
    <path d="M330 220c4 8 6 12 0 14s-4-6 0-14z"/>
    <path d="M360 196c4 8 6 12 0 14s-4-6 0-14z"/>
  </g>

  <!-- Pulverizador -->
  <g transform="translate(470 120)" filter="url(#sh)">
    <rect x="30" y="80" width="70" height="170" rx="22" fill="url(#bottle)"/>
    <rect x="46" y="58" width="38" height="26" rx="4" fill="#1a2a3c"/>
    <path d="M40 30h50l-6 30H46z" fill="#2b3e55"/>
    <rect x="0" y="34" width="44" height="14" rx="4" fill="#2b3e55"/>
    <path d="M80 56c14 6 16 30 6 44" fill="none" stroke="#2b3e55" stroke-width="10" stroke-linecap="round"/>
    <rect x="40" y="130" width="50" height="52" rx="6" fill="#fff" opacity=".9"/>
    <path d="M52 150h26M52 162h18" stroke="#0f6bd8" stroke-width="4" stroke-linecap="round"/>
    <text x="65" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#0b2545">CLEAN</text>
  </g>
  <!-- Névoa do spray -->
  <ellipse cx="420" cy="150" rx="70" ry="34" fill="url(#mist)"/>
  <g fill="#fff">
    <circle cx="400" cy="140" r="3"/><circle cx="380" cy="156" r="2.5"/><circle cx="410" cy="164" r="2"/>
    <circle cx="370" cy="132" r="2"/><circle cx="430" cy="146" r="2.5"/>
  </g>

  <!-- Selo -->
  <g transform="translate(40 300)" filter="url(#sh)">
    <rect width="150" height="60" rx="14" fill="#fff"/>
    <circle cx="30" cy="30" r="16" fill="#e7f9ef"/>
    <path d="M22 30l6 6 11-12" fill="none" stroke="#25a35f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="26" font-family="Arial, sans-serif" font-size="11" fill="#5b6b7c">Ar mais</text>
    <text x="54" y="44" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0b2545">saudável</text>
  </g>
</svg>
