<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520">
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5fb"/>
      <stop offset="1" stop-color="#dde9f4"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0f3"/>
      <stop offset="1" stop-color="#6fb4e8"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b2545" flood-opacity=".22"/>
    </filter>
    <g id="pin">
      <path d="M0 0c-14-18-22-28-22-40a22 22 0 0 1 44 0c0 12-8 22-22 40z" fill="#0f6bd8"/>
      <circle cy="-40" r="8" fill="#fff"/>
    </g>
  </defs>
  <rect width="520" height="520" rx="22" fill="url(#land)"/>

  <!-- grade -->
  <g stroke="#cfdeec" stroke-width="1">
    <path d="M0 104h520M0 208h520M0 312h520M0 416h520M104 0v520M208 0v520M312 0v520M416 0v520"/>
  </g>

  <!-- Rio dos Sinos / Lago Guaíba (ilustrativo) -->
  <path d="M0 470c60-10 90-40 120-80s40-60 30-110c-8-40 10-70 30-90" fill="none" stroke="url(#water)" stroke-width="10" stroke-linecap="round"/>
  <path d="M0 520V430c40 0 70-20 100-30 40-14 50 10 70 40 20 30 10 60 0 80z" fill="url(#water)"/>
  <path d="M180 180c40-30 90-40 140-60s80-40 120-30" fill="none" stroke="url(#water)" stroke-width="8" stroke-linecap="round"/>

  <!-- BR-116 -->
  <path d="M300 30c-10 60-6 110-12 160s-20 90-30 140-20 100-30 170" fill="none" stroke="#ffc21a" stroke-width="8" stroke-linecap="round"/>
  <path d="M300 30c-10 60-6 110-12 160s-20 90-30 140-20 100-30 170" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="10 10"/>
  <g transform="translate(330 250)">
    <rect x="-22" y="-14" width="44" height="28" rx="6" fill="#fff" stroke="#c9d6e3"/>
    <text y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#5b6b7c">BR-116</text>
  </g>

  <!-- Cidades (de norte a sul) -->
  <g font-family="Arial, sans-serif" font-weight="700" fill="#0b2545">
    <g transform="translate(296 110)" filter="url(#sh)">
      <use href="#pin"/>
      <rect x="30" y="-58" width="150" height="34" rx="10" fill="#fff"/>
      <text x="105" y="-36" text-anchor="middle" font-size="15">São Leopoldo</text>
    </g>
    <g transform="translate(286 220)" filter="url(#sh)">
      <use href="#pin"/>
      <rect x="30" y="-58" width="160" height="34" rx="10" fill="#fff"/>
      <text x="110" y="-36" text-anchor="middle" font-size="15">Sapucaia do Sul</text>
    </g>
    <g transform="translate(268 330)" filter="url(#sh)">
      <use href="#pin"/>
      <rect x="30" y="-58" width="104" height="34" rx="10" fill="#fff"/>
      <text x="82" y="-36" text-anchor="middle" font-size="15">Canoas</text>
    </g>
    <g transform="translate(246 460)" filter="url(#sh)">
      <path d="M0 0c-18-22-28-34-28-50a28 28 0 0 1 56 0c0 16-10 28-28 50z" fill="#ff7a1a"/>
      <circle cy="-50" r="10" fill="#fff"/>
      <rect x="36" y="-70" width="140" height="38" rx="10" fill="#0b2545"/>
      <text x="106" y="-45" text-anchor="middle" font-size="16" fill="#fff">Porto Alegre</text>
    </g>
  </g>

  <!-- Raio de atendimento -->
  <ellipse cx="275" cy="270" rx="200" ry="245" fill="none" stroke="#0f6bd8" stroke-width="2" stroke-dasharray="6 8" opacity=".5"/>

  <!-- Bússola -->
  <g transform="translate(470 470)">
    <circle r="26" fill="#fff" stroke="#c9d6e3"/>
    <path d="M0-18l6 18-6 18-6-18z" fill="#0f6bd8"/>
    <path d="M0-18l6 18h-12z" fill="#ff7a1a"/>
    <text y="-30" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#5b6b7c">N</text>
  </g>
</svg>
